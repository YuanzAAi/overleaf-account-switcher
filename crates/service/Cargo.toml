[package]
name = "overleaf-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "overleaf_service"
path = "src/lib.rs"

[[bin]]
name = "overleaf-service-api"
path = "src/bin/overleaf-service-api.rs"

[dependencies]
overleaf-core = { path = "../core" }
overleaf-storage = { path = "../storage" }
overleaf-api = { path = "../overleaf-api" }
overleaf-browser = { path = "../browser" }
overleaf-workflows = { path = "../workflows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["net", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
tempfile = "3"
